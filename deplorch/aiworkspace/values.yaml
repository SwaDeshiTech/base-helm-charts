namespace: ""
serviceName: ""
applicationName: ""
baseReleaseName: ""
httpPort: ""
aiWorkspaceImage: ""
aiWorkspaceProdhubURL: ""
aiWorkspaceUserID: ""
aiWorkspaceToken: ""
aiWorkspacePreviewUrl: ""
imagePullPolicy: Always
replicas: 1
cpuRequest: 250m
cpuLimit: 1000m
memoryRequest: 256Mi
memoryLimit: 4Gi
ephemeralStorageRequest: 1Gi
ephemeralStorageLimit: 4Gi
# Bound the writable emptyDir volumes independently from the container-wide
# ephemeral-storage limit. These may be raised for unusually large repositories.
workspaceEmptyDirSizeLimit: 3Gi
tmpEmptyDirSizeLimit: 1Gi
persistence:
  # A workspace PVC retains the repository, generated code, and OpenCode configuration/session state across pod restarts.
  enabled: true
  accessMode: ReadWriteOnce
  size: 5Gi
  # Leave blank to use the cluster's default StorageClass.
  storageClass: ""
  # Set to mount a pre-provisioned claim rather than creating a per-workspace claim.
  existingClaim: ""
