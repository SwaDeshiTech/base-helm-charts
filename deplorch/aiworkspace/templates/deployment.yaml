{{- $port := required "httpPort is required" .Values.httpPort | int -}}
{{- $releaseName := default .Release.Name .Values.baseReleaseName -}}
{{- $workspaceClaimName := default (printf "%s-workspace" $releaseName | trunc 63 | trimSuffix "-") .Values.persistence.existingClaim -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $releaseName }}
  namespace: {{ required "namespace is required" .Values.namespace }}
  labels:
    release: {{ $releaseName | quote }}
    app.kubernetes.io/name: {{ required "applicationName is required" .Values.applicationName | quote }}
    prodhub.in/application: {{ required "applicationName is required" .Values.applicationName | quote }}
    prodhub.in/ephemeral-environment: {{ .Values.namespace | quote }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      release: {{ $releaseName | quote }}
  template:
    metadata:
      annotations:
        {{- if .Values.restartNonce }}
        prodhub.in/restart: {{ .Values.restartNonce | quote }}
        {{- end }}
      labels:
        release: {{ default .Release.Name .Values.baseReleaseName | quote }}
        app.kubernetes.io/name: {{ .Values.applicationName | quote }}
        prodhub.in/application: {{ .Values.applicationName | quote }}
        prodhub.in/ephemeral-environment: {{ .Values.namespace | quote }}
    spec:
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: dockerhub
      containers:
        - name: ai-workspace
          image: {{ required "aiWorkspaceImage is required" .Values.aiWorkspaceImage | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy | quote }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ $port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.httpPort | quote }}
            - name: SERVER_PORT
              value: {{ .Values.httpPort | quote }}
            - name: AI_PRODHUB_URL
              value: {{ .Values.aiWorkspaceProdhubURL | quote }}
            - name: AI_USER_ID
              value: {{ .Values.aiWorkspaceUserID | quote }}
            - name: AI_PRODHUB_TOKEN
              value: {{ .Values.aiWorkspaceToken | quote }}
            - name: AI_WORKSPACE_STANDALONE
              value: "true"
            - name: PRODHUB_PREVIEW_URL
              value: {{ .Values.aiWorkspacePreviewUrl | quote }}
            # Keep user-writable tool state off the read-only container filesystem.
            - name: HOME
              value: /workspace
            - name: XDG_CONFIG_HOME
              value: /workspace/.config
            - name: XDG_DATA_HOME
              value: /workspace/.local/share
            - name: XDG_CACHE_HOME
              value: /workspace/.cache
            - name: BUN_INSTALL
              value: /workspace/.bun
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: {{ .Values.cpuRequest }}
              memory: {{ .Values.memoryRequest }}
              ephemeral-storage: {{ .Values.ephemeralStorageRequest }}
            limits:
              cpu: {{ .Values.cpuLimit }}
              memory: {{ .Values.memoryLimit }}
              ephemeral-storage: {{ .Values.ephemeralStorageLimit }}
      volumes:
        - name: workspace
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $workspaceClaimName | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
