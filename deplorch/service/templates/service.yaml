{{- $portEntries := list -}}
{{- $seenPorts := dict -}}
{{- $portSources := list
      (dict "kind" "http" "value" (.Values.httpPort | default ""))
      (dict "kind" "grpc" "value" (.Values.grpcPort | default ""))
      (dict "kind" "tcp" "value" (.Values.tcpPort | default ""))
      (dict "kind" "tcp" "value" (.Values.ports | default "")) -}}
{{- range $source := $portSources -}}
  {{- range $rawPort := splitList "," (toString $source.value) -}}
    {{- $port := trim $rawPort -}}
    {{- if $port -}}
      {{- if not (regexMatch "^[0-9]+$" $port) -}}
        {{- fail (printf "invalid %s port %q: ports must be comma-separated numbers" $source.kind $port) -}}
      {{- end -}}
      {{- $portNumber := int $port -}}
      {{- if or (lt $portNumber 1) (gt $portNumber 65535) -}}
        {{- fail (printf "invalid %s port %q: port must be between 1 and 65535" $source.kind $port) -}}
      {{- end -}}
      {{- if not (hasKey $seenPorts $port) -}}
        {{- $_ := set $seenPorts $port true -}}
        {{- $portEntries = append $portEntries (dict "kind" $source.kind "port" $portNumber) -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if eq (len $portEntries) 0 -}}
  {{- fail "at least one HTTP, gRPC, or TCP port is required" -}}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    release: {{ default .Release.Name .Values.baseReleaseName }}
    type: k8s
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{.Release.Name}}
    meta.helm.sh/release-namespace: {{.Release.Namespace}}
  name: {{ default .Release.Name .Values.baseReleaseName }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    release: {{ default .Release.Name .Values.baseReleaseName }}
  type: ClusterIP
  ports:
    {{- range $entry := $portEntries }}
    - name: {{ printf "%s-%d" $entry.kind $entry.port | trunc 15 | trimSuffix "-" }}
      port: {{ $entry.port }}
      protocol: TCP
      targetPort: {{ $entry.port }}
    {{- end }}
