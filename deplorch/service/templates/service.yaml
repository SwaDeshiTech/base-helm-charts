---
apiVersion: v1
kind: Service
metadata:
  labels:
    release: {{.Release.Name}}
    type: k8s
  name: {{.Release.Name}}
  namespace: {{.Values.namespace}}
spec:
  selector:
    release: {{.Release.Name}}
  type: ClusterIP
  ports:
    {{- if eq .Values.isGRPCPortEnabled "enabled" }}
    - name: grpc
      port: 80
      protocol: TCP
      targetPort: {{.Values.grpcPort}}
    - name: http
      port: 8080
      protocol: TCP
      targetPort: {{.Values.ports}}
    {{- else}}
    - name: http
      port: 80
      protocol: TCP
      targetPort: {{.Values.ports}}
    {{- end}}

