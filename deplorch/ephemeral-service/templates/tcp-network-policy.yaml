{{- $hasTcpPort := ne (trim (toString (.Values.tcpPort | default ""))) "" -}}
{{- $hasGrpcPort := ne (trim (toString (.Values.grpcPort | default ""))) "" -}}
{{- if or $hasTcpPort $hasGrpcPort }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ default .Release.Name .Values.baseReleaseName }}-tcp-isolation
  namespace: {{ .Values.namespace }}
  labels:
    release: {{ default .Release.Name .Values.baseReleaseName | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  podSelector:
    matchLabels:
      release: {{ default .Release.Name .Values.baseReleaseName | quote }}
  policyTypes:
    - Ingress
  ingress:
    # HTTP reaches these pods through the namespace-local environment
    # orchestrator. TCP clients in another Preview Space require a separate,
    # approval-managed NetworkPolicy generated by ProdHub.
    - from:
        - podSelector: {}
{{- end }}
