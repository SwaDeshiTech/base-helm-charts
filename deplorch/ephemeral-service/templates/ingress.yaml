{{- if .Values.ingress -}}
{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ default .Release.Name .Values.baseReleaseName }}-ingress
  namespace: {{ .Values.namespace }}
  labels:
    release: {{ default .Release.Name .Values.baseReleaseName }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range $.Values.ingress.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .backend.service.name | default (default $.Release.Name $.Values.baseReleaseName) }}
                port:
                  number: {{ .backend.service.port.number | default 80 }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
