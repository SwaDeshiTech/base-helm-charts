{{- $aiModeEnabled := eq (lower (toString .Values.aiCodeGenerationEnabled)) "true" -}}
{{- $portEntries := list -}}
{{- $seenPorts := dict -}}
{{- $portSources := list
      (dict "kind" "http" "value" (.Values.httpPort | default ""))
      (dict "kind" "grpc" "value" (.Values.grpcPort | default ""))
      (dict "kind" "tcp" "value" (.Values.tcpPort | default ""))
      (dict "kind" "tcp" "value" (.Values.ports | default "")) -}}
{{- range $source := $portSources -}}
  {{- range $rawPort := splitList "," (toString $source.value) -}}
    {{- $port := trim $rawPort -}}
    {{- if $port -}}
      {{- if not (regexMatch "^[0-9]+$" $port) -}}
        {{- fail (printf "invalid %s port %q: ports must be comma-separated numbers" $source.kind $port) -}}
      {{- end -}}
      {{- $portNumber := int $port -}}
      {{- if or (lt $portNumber 1) (gt $portNumber 65535) -}}
        {{- fail (printf "invalid %s port %q: port must be between 1 and 65535" $source.kind $port) -}}
      {{- end -}}
      {{- if not (hasKey $seenPorts $port) -}}
        {{- $_ := set $seenPorts $port true -}}
        {{- $portEntries = append $portEntries (dict "kind" $source.kind "port" $portNumber) -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if eq (len $portEntries) 0 -}}
  {{- fail "at least one HTTP, gRPC, or TCP port is required" -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ default .Release.Name .Values.baseReleaseName }}
  namespace: {{.Values.namespace}}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    release: {{ default .Release.Name .Values.baseReleaseName | quote }}
    app.kubernetes.io/name: {{ default .Values.serviceName .Values.applicationName | quote }}
    app.kubernetes.io/instance: {{ default .Release.Name .Values.baseReleaseName | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    prodhub.in/application: {{ default .Values.serviceName .Values.applicationName | quote }}
    prodhub.in/ephemeral-environment: {{ .Values.namespace | quote }}
    {{- if .Values.deploymentProfileName }}
    prodhub.in/deployment-profile: {{ .Values.deploymentProfileName | quote }}
    {{- end }}
spec:
  replicas: {{ .Values.replicas | default 0 }}
  selector:
    matchLabels:
      release: {{ default .Release.Name .Values.baseReleaseName }}
  template:
    metadata:
      annotations:
        {{- if .Values.restartNonce }}
        prodhub.in/restart: {{ .Values.restartNonce | quote }}
        {{- end }}
        {{- if $aiModeEnabled }}
        prodhub.in/ai-workspace-restart: {{ .Values.aiWorkspaceRestartNonce | default "enabled" | quote }}
        {{- end }}
      labels:
        release: {{ default .Release.Name .Values.baseReleaseName | quote }}
        app.kubernetes.io/name: {{ default .Values.serviceName .Values.applicationName | quote }}
        app.kubernetes.io/instance: {{ default .Release.Name .Values.baseReleaseName | quote }}
        app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
        prodhub.in/application: {{ default .Values.serviceName .Values.applicationName | quote }}
        prodhub.in/ephemeral-environment: {{ .Values.namespace | quote }}
        {{- if .Values.deploymentProfileName }}
        prodhub.in/deployment-profile: {{ .Values.deploymentProfileName | quote }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 60
      {{- if $aiModeEnabled }}
      # AI workspaces do not need in-cluster API access; terminal access is proxied by CloudEdge.
      automountServiceAccountToken: false
      {{- end }}
      {{- if .Values.environmentOrchestratorDns.enabled }}
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - {{ required "environmentOrchestratorDns.nameserver is required when environmentOrchestratorDns.enabled=true" .Values.environmentOrchestratorDns.nameserver | quote }}
        {{- with .Values.environmentOrchestratorDns.searches }}
        searches:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- with .Values.environmentOrchestratorDns.options }}
        options:
{{ toYaml . | indent 10 }}
        {{- end }}
      {{- else }}
      dnsPolicy: ClusterFirst
      {{- end }}
      imagePullSecrets:
      - name: {{ default .Release.Name .Values.baseReleaseName }}-dockerregistry
      - name: dockerhub
      {{- if eq .Values.isNodeSelectorEnabled "enabled" }}
      tolerations:
      - effect: NoSchedule
        key: app
        operator: Equal
        value: {{.Values.nodeSelectorApp}}
      nodeSelector:
        app: {{.Values.nodeSelectorApp}}
      {{- end}}
      containers:
      {{- if $aiModeEnabled }}
      - name: ai-workspace
        image: {{ .Values.aiWorkspaceImage | default "dockerhub.prodhub.in/prodhub-ai-workspace:opencode" | quote }}
        imagePullPolicy: {{ .Values.imagePullPolicy | default "Always" | quote }}
        ports:
        {{- range $entry := $portEntries }}
        - name: {{ printf "%s-%d" $entry.kind $entry.port | trunc 15 | trimSuffix "-" }}
          containerPort: {{ $entry.port }}
          protocol: TCP
        {{- end }}
        env:
        - name: PORT
          value: {{ (index $portEntries 0).port | quote }}
        - name: SERVER_PORT
          value: {{ (index $portEntries 0).port | quote }}
        - name: AI_PRODHUB_URL
          value: {{ .Values.aiWorkspaceProdhubURL | quote }}
        - name: AI_USER_ID
          value: {{ .Values.aiWorkspaceUserID | quote }}
        - name: AI_SCM_ID
          value: {{ .Values.aiWorkspaceScmId | quote }}
        - name: AI_REPOSITORY
          value: {{ .Values.aiWorkspaceRepository | quote }}
        - name: AI_REPO_BRANCH
          value: {{ .Values.aiWorkspaceBranch | quote }}
        - name: AI_PRODHUB_TOKEN
          value: {{ .Values.aiWorkspaceToken | quote }}
        volumeMounts:
        - name: ai-workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: {{ .Values.cpuRequest }}
            memory: {{ .Values.memoryRequest }}
            ephemeral-storage: {{ .Values.ephemeralStorageRequest }}
          limits:
            cpu: {{ .Values.cpuLimit }}
            memory: {{ .Values.memoryLimit }}
            ephemeral-storage: {{ .Values.ephemeralStorageLimit }}
      {{- else }}
      - image: {{.Values.registryURL}}/{{.Values.imageTag}}
        name: {{ .Values.serviceName | default (default .Release.Name .Values.baseReleaseName) }}
        imagePullPolicy: {{ .Values.imagePullPolicy | default "Always" | quote }}
        command: [{{.Values.startUpCommand}}]
        ports:
        {{- range $entry := $portEntries }}
        - name: {{ printf "%s-%d" $entry.kind $entry.port | trunc 15 | trimSuffix "-" }}
          containerPort: {{ $entry.port }}
          protocol: TCP
        {{- end }}
        env:
        - name: APP
          value: {{.Values.serviceName}}
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: PORT
          value: {{ (index $portEntries 0).port | quote }}
        - name: SERVER_PORT
          value: {{ (index $portEntries 0).port | quote }}
        - name: ENV
          value: {{.Values.env}}
        resources:
          requests:
            cpu: {{.Values.cpuRequest}}
            memory: {{.Values.memoryRequest}}
            ephemeral-storage: {{.Values.ephemeralStorageRequest}}
          limits:
            cpu: {{.Values.cpuLimit}}
            memory: {{.Values.memoryLimit}}
            ephemeral-storage: {{.Values.ephemeralStorageLimit}}
      {{- end }}
      {{- if or (eq .Values.isSharedMemoryEnabled "enabled") $aiModeEnabled }}
      volumes:
      {{- if eq .Values.isSharedMemoryEnabled "enabled"}}
        - name: sharedmemory-{{.Values.serviceName}}
          emptyDir:
            medium: Memory
            sizeLimit: {{.Values.sharedMemoryLimit}}
      {{- end}}
      {{- if $aiModeEnabled }}
        - name: ai-workspace
          emptyDir: {}
      {{- end }}
      {{- end }}
