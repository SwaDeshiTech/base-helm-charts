apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ default .Release.Name .Values.baseReleaseName }}
  namespace: {{.Values.namespace}}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    release: {{ default .Release.Name .Values.baseReleaseName | quote }}
    app.kubernetes.io/name: {{ default .Values.serviceName .Values.applicationName | quote }}
    app.kubernetes.io/instance: {{ default .Release.Name .Values.baseReleaseName | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    prodhub.in/application: {{ default .Values.serviceName .Values.applicationName | quote }}
    prodhub.in/ephemeral-environment: {{ .Values.namespace | quote }}
    {{- if .Values.deploymentProfileName }}
    prodhub.in/deployment-profile: {{ .Values.deploymentProfileName | quote }}
    {{- end }}
spec:
  replicas: {{ .Values.replicas | default 0 }}
  selector:
    matchLabels:
      release: {{ default .Release.Name .Values.baseReleaseName }}
  template:
    metadata:
      labels:
        release: {{ default .Release.Name .Values.baseReleaseName | quote }}
        app.kubernetes.io/name: {{ default .Values.serviceName .Values.applicationName | quote }}
        app.kubernetes.io/instance: {{ default .Release.Name .Values.baseReleaseName | quote }}
        app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
        prodhub.in/application: {{ default .Values.serviceName .Values.applicationName | quote }}
        prodhub.in/ephemeral-environment: {{ .Values.namespace | quote }}
        {{- if .Values.deploymentProfileName }}
        prodhub.in/deployment-profile: {{ .Values.deploymentProfileName | quote }}
        {{- end }}
        {{- if .Values.aiCodeGenerationEnabled }}
        prodhub.in/ai-workspace-restart: {{ .Values.aiWorkspaceRestartNonce | default "enabled" | quote }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 60
      {{- if .Values.environmentOrchestratorDns.enabled }}
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - {{ required "environmentOrchestratorDns.nameserver is required when environmentOrchestratorDns.enabled=true" .Values.environmentOrchestratorDns.nameserver | quote }}
        {{- with .Values.environmentOrchestratorDns.searches }}
        searches:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- with .Values.environmentOrchestratorDns.options }}
        options:
{{ toYaml . | indent 10 }}
        {{- end }}
      {{- else }}
      dnsPolicy: ClusterFirst
      {{- end }}
      imagePullSecrets:
      - name: {{ default .Release.Name .Values.baseReleaseName }}-dockerregistry
      - name: dockerhub
      {{- if eq .Values.isNodeSelectorEnabled "enabled" }}
      tolerations:
      - effect: NoSchedule
        key: app
        operator: Equal
        value: {{.Values.nodeSelectorApp}}
      nodeSelector:
        app: {{.Values.nodeSelectorApp}}
      {{- end}}
      containers:
      {{- if not .Values.aiCodeGenerationEnabled }}
      - image: {{.Values.registryURL}}/{{.Values.imageTag}}
        name: {{ .Values.serviceName | default (default .Release.Name .Values.baseReleaseName) }}
        command: [{{.Values.startUpCommand}}] 
        ports:
        - containerPort: {{.Values.ports}}
        {{- if eq .Values.isGRPCPortEnabled "enabled"}}
        - containerPort: {{.Values.grpcPort}}
        {{- end}}
        env:
        - name: APP
          value: {{.Values.serviceName}}
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: PORT
          value: "{{.Values.ports}}"
        - name: SERVER_PORT
          value: "{{.Values.ports}}"
        - name: ENV
          value: {{.Values.env}}
        {{- if .Values.aiCodeGenerationEnabled }}
        - name: AI_CODE_GENERATION_ENABLED
          value: "true"
        {{- if .Values.aiWorkspacePort }}
        - name: AI_WORKSPACE_PORT
          value: {{ .Values.aiWorkspacePort | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.aiCodeGenerationEnabled }}
        volumeMounts:
        - name: ai-workspace
          mountPath: /workspace
        {{- end }}
        resources:
          requests:
            cpu: {{.Values.cpuRequest}}
            memory: {{.Values.memoryRequest}}
            ephemeral-storage: {{.Values.ephemeralStorageRequest}}
          limits:
            cpu: {{.Values.cpuLimit}}
            memory: {{.Values.memoryLimit}}
            ephemeral-storage: {{.Values.ephemeralStorageLimit}}
      {{- end }}
      {{- if .Values.aiCodeGenerationEnabled }}
      - name: ai-workspace
        image: {{ .Values.aiWorkspaceImage | default "dockerhub.prodhub.in/prodhub-ai-workspace:open-interpreter" | quote }}
        ports:
        - containerPort: {{ .Values.ports }}
          protocol: TCP
        env:
        - name: PORT
          value: {{ .Values.ports | quote }}
        - name: SERVER_PORT
          value: {{ .Values.ports | quote }}
        - name: AI_PRODHUB_URL
          value: {{ .Values.aiWorkspaceProdhubURL | quote }}
        - name: AI_USER_ID
          value: {{ .Values.aiWorkspaceUserID | quote }}
        - name: AI_SCM_ID
          value: {{ .Values.aiWorkspaceScmId | quote }}
        - name: AI_REPOSITORY
          value: {{ .Values.aiWorkspaceRepository | quote }}
        - name: AI_REPO_BRANCH
          value: {{ .Values.aiWorkspaceBranch | quote }}
        - name: AI_PRODHUB_TOKEN
          value: {{ .Values.aiWorkspaceToken | quote }}
        volumeMounts:
        - name: ai-workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
      {{- end }}
      {{- if or (eq .Values.isSharedMemoryEnabled "enabled") .Values.aiCodeGenerationEnabled }}
      volumes:
      {{- if eq .Values.isSharedMemoryEnabled "enabled"}}
        - name: sharedmemory-{{.Values.serviceName}}
          emptyDir:
            medium: Memory
            sizeLimit: {{.Values.sharedMemoryLimit}}
      {{- end}}
      {{- if .Values.aiCodeGenerationEnabled }}
        - name: ai-workspace
          emptyDir: {}
      {{- end }}
      {{- end }}
