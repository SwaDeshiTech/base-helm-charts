apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ default .Release.Name .Values.baseReleaseName }}
  namespace: {{.Values.namespace}}
  labels:
    release: {{ default .Release.Name .Values.baseReleaseName | quote }}
    app.kubernetes.io/name: {{ default .Values.serviceName .Values.applicationName | quote }}
    app.kubernetes.io/instance: {{ default .Release.Name .Values.baseReleaseName | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    prodhub.in/application: {{ default .Values.serviceName .Values.applicationName | quote }}
    prodhub.in/ephemeral-environment: {{ .Values.namespace | quote }}
    {{- if .Values.deploymentProfileName }}
    prodhub.in/deployment-profile: {{ .Values.deploymentProfileName | quote }}
    {{- end }}
spec:
  replicas: {{ .Values.replicas | default 0 }}
  selector:
    matchLabels:
      release: {{ default .Release.Name .Values.baseReleaseName }}
  template:
    metadata:
      labels:
        release: {{ default .Release.Name .Values.baseReleaseName | quote }}
        app.kubernetes.io/name: {{ default .Values.serviceName .Values.applicationName | quote }}
        app.kubernetes.io/instance: {{ default .Release.Name .Values.baseReleaseName | quote }}
        app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
        prodhub.in/application: {{ default .Values.serviceName .Values.applicationName | quote }}
        prodhub.in/ephemeral-environment: {{ .Values.namespace | quote }}
        {{- if .Values.deploymentProfileName }}
        prodhub.in/deployment-profile: {{ .Values.deploymentProfileName | quote }}
        {{- end }}
        {{- if .Values.aiCodeGenerationEnabled }}
        prodhub.in/ai-workspace-restart: {{ .Values.aiWorkspaceRestartNonce | default "enabled" | quote }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 60
      {{- if .Values.environmentOrchestratorDns.enabled }}
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - {{ required "environmentOrchestratorDns.nameserver is required when environmentOrchestratorDns.enabled=true" .Values.environmentOrchestratorDns.nameserver | quote }}
        {{- with .Values.environmentOrchestratorDns.searches }}
        searches:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- with .Values.environmentOrchestratorDns.options }}
        options:
{{ toYaml . | indent 10 }}
        {{- end }}
      {{- else }}
      dnsPolicy: ClusterFirst
      {{- end }}
      imagePullSecrets:
      - name: {{ default .Release.Name .Values.baseReleaseName }}-dockerregistry
      {{- if eq .Values.isNodeSelectorEnabled "enabled" }}
      tolerations:
      - effect: NoSchedule
        key: app
        operator: Equal
        value: {{.Values.nodeSelectorApp}}
      nodeSelector:
        app: {{.Values.nodeSelectorApp}}
      {{- end}}
      containers:
      - image: {{.Values.registryURL}}/{{.Values.imageTag}}
        name: {{ .Values.serviceName | default (default .Release.Name .Values.baseReleaseName) }}
        command: [{{.Values.startUpCommand}}] 
        ports:
        - containerPort: {{.Values.ports}}
        {{- if eq .Values.isGRPCPortEnabled "enabled"}}
        - containerPort: {{.Values.grpcPort}}
        {{- end}}
        env:
        - name: APP
          value: {{.Values.serviceName}}
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: PORT
          value: "{{.Values.ports}}"
        - name: SERVER_PORT
          value: "{{.Values.ports}}"
        - name: ENV
          value: {{.Values.env}}
        {{- if .Values.aiCodeGenerationEnabled }}
        - name: AI_CODE_GENERATION_ENABLED
          value: "true"
        {{- if .Values.aiWorkspacePort }}
        - name: AI_WORKSPACE_PORT
          value: {{ .Values.aiWorkspacePort | quote }}
        {{- end }}
        {{- end }}
        resources:
          requests:
            cpu: {{.Values.cpuRequest}}
            memory: {{.Values.memoryRequest}}
            ephemeral-storage: {{.Values.ephemeralStorageRequest}}
          limits:
            cpu: {{.Values.cpuLimit}}
            memory: {{.Values.memoryLimit}}
            ephemeral-storage: {{.Values.ephemeralStorageLimit}}
      {{- if .Values.aiCodeGenerationEnabled }}
      - name: ai-workspace
        image: {{ .Values.aiWorkspaceImage | default "python:3.12-slim" | quote }}
        command: ["sh", "-c"]
        args:
        - >-
          set -eu;
          mkdir -p /workspace;
          apt-get update;
          apt-get install -y --no-install-recommends git ca-certificates;
          rm -rf /var/lib/apt/lists/*;
          python -m pip install --no-cache-dir --disable-pip-version-check aider-chat;
          python -c 'import json, os, urllib.request; u=os.environ["AI_PRODHUB_URL"].rstrip("/")+"/credentialProvider/ai-workspace"; r=urllib.request.Request(u, headers={"X-Service-Name":"cloudedge-deployer","uuid":os.environ["AI_USER_ID"]}); d=json.load(urllib.request.urlopen(r, timeout=10)); names={"OpenAI":"OPENAI_API_KEY","Gemini":"GEMINI_API_KEY","Anthropic":"ANTHROPIC_API_KEY","DeepSeek":"DEEPSEEK_API_KEY","OpenRouter":"OPENROUTER_API_KEY"}; out=[]; [out.append(names[x.get("type")]+"="+json.loads(x["credentialMetadata"])["api_key"]) for x in d.get("response",[]) if x.get("credentialMetadata") and x.get("type") in names and json.loads(x["credentialMetadata"]).get("api_key")]; open("/workspace/.ai-env","w").write("\\n".join(out)+"\\n")';
          python -c 'import json, os, urllib.request; u=os.environ["AI_PRODHUB_URL"].rstrip("/")+"/credentialProvider/scm-workspace/"+os.environ["AI_SCM_ID"]; r=urllib.request.Request(u, headers={"X-Service-Name":"cloudedge-deployer","uuid":os.environ["AI_USER_ID"]}); d=json.load(urllib.request.urlopen(r, timeout=10)); open("/workspace/.scm-credential.json","w").write(d["response"]["credentialMetadata"])';
          python -c 'import json, os; d=json.load(open("/workspace/.scm-credential.json")); token=d.get("github_token") or d.get("gitlab_token") or d.get("bitbucket_app_password"); repo=os.environ["AI_REPOSITORY"].strip("/"); is_gitlab=bool(d.get("gitlab_token")); is_bitbucket=bool(d.get("bitbucket_app_password")); prefix=(d.get("gitlab_group") if is_gitlab else (d.get("bitbucket_workspace") if is_bitbucket else (d.get("github_org") or d.get("github_owner")))); repo=repo if "/" in repo or not prefix else prefix.strip("/")+"/"+repo; base=d.get("gitlab_url", "https://github.com").rstrip("/") if is_gitlab else ("https://bitbucket.org" if is_bitbucket else "https://github.com"); open("/workspace/.git-token","w").write((d.get("bitbucket_username", "git"))+"\\n"+str(token)+"\\n"); open("/workspace/.git-url","w").write(base+"/"+repo+".git") if token else (_ for _ in ()).throw(RuntimeError("SCM token was not found"))';
          printf '#!/bin/sh\\ncase "$1" in *Username*) sed -n "1p" /workspace/.git-token ;; *) sed -n "2p" /workspace/.git-token ;; esac\\n' > /workspace/.git-askpass;
          chmod 700 /workspace/.git-askpass;
          export GIT_ASKPASS=/workspace/.git-askpass GIT_TERMINAL_PROMPT=0;
          git clone --branch "$AI_REPO_BRANCH" "$(cat /workspace/.git-url)" /workspace/repository;
          cp /workspace/.ai-env /workspace/repository/.env;
          chmod 600 /workspace/repository/.env /workspace/.git-token /workspace/.scm-credential.json;
          rm -f /workspace/.ai-env /workspace/.scm-credential.json /workspace/.git-token /workspace/.git-askpass /workspace/.git-url;
          exec sleep infinity
        env:
        - name: AI_PRODHUB_URL
          value: {{ .Values.aiWorkspaceProdhubURL | quote }}
        - name: AI_USER_ID
          value: {{ .Values.aiWorkspaceUserID | quote }}
        - name: AI_SCM_ID
          value: {{ .Values.aiWorkspaceScmId | quote }}
        - name: AI_REPOSITORY
          value: {{ .Values.aiWorkspaceRepository | quote }}
        - name: AI_REPO_BRANCH
          value: {{ .Values.aiWorkspaceBranch | quote }}
        volumeMounts:
        - name: ai-workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
      {{- end }}
      {{- if or (eq .Values.isSharedMemoryEnabled "enabled") .Values.aiCodeGenerationEnabled }}
      volumes:
      {{- if eq .Values.isSharedMemoryEnabled "enabled"}}
        - name: sharedmemory-{{.Values.serviceName}}
          emptyDir:
            medium: Memory
            sizeLimit: {{.Values.sharedMemoryLimit}}
      {{- end}}
      {{- if .Values.aiCodeGenerationEnabled }}
        - name: ai-workspace
          emptyDir: {}
      {{- end }}
      {{- end }}
