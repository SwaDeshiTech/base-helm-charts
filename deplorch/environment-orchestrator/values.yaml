namespace: ""
baseReleaseName: ""

replicaCount: 1
pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub

coredns:
  image:
    repository: harry2654/prodhub
    tag: environmentorchestrator-corednsproduction-1629940-38a993c
  service:
    type: ClusterIP
    clusterIP: ""
    port: 53
    httpPort: 8080

haproxy:
  image:
    repository: harry2654/prodhub
    tag: environmentorchestrator-haproxyproduction-0862575-38a993c
  service:
    type: ClusterIP
    port: 80
    targetPort: 80

listener:
  image:
    repository: harry2654/prodhub
    tag: environmentorchestrator-listenerproduction-9472757-38a993c

config:
  serviceDomain: "prodhub.in"
  upstreamDnsAddr: "8.8.8.8:53"
  dnsConfigMapName: "environment-orchestrator-dns"
  resyncInterval: "30s"
  syncTimeout: "5s"

serviceAccount:
  create: true
  name: ""

resources: {}

ingress:
  enabled: true
  className: "traefik"
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
