namespace: ""
baseReleaseName: ""

replicaCount: 1
pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub

coredns:
  image:
    repository: harry2654/prodhub
    tag: environmentorchestrator-corednsproduction-5957129-1da66fa
  service:
    type: ClusterIP
    clusterIP: ""
    port: 53

haproxy:
  image:
    repository: harry2654/prodhub
    tag: environmentorchestrator-haproxyproduction-4698229-fdb58dc
  service:
    type: ClusterIP
    port: 80
    targetPort: 80

listener:
  image:
    repository: harry2654/prodhub
    tag: environmentorchestrator-listenerproduction-6515072-04303aa

config:
  serviceDomain: "prodhub.in"
  upstreamDnsAddr: "8.8.8.8:53"
  dnsConfigMapName: "environment-orchestrator-dns"
  resyncInterval: "30s"
  syncTimeout: "5s"

serviceAccount:
  create: true
  name: ""

resources: {}

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

nodeSelector: {}
tolerations: []
affinity: {}
