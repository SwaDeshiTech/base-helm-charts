namespace: ""
baseReleaseName: ""

replicaCount: 1
pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dockerhub

coredns:
  image:
    repository: harry2654/prodhub
    tag: environmentorchestrator-corednsproduction-1629940-047fe06
  service:
    type: ClusterIP
    clusterIP: ""
    port: 53
    httpPort: 8080

haproxy:
  image:
    repository: harry2654/prodhub
    tag: environmentorchestrator-haproxyproduction-0862575-047fe06
  service:
    type: ClusterIP
    port: 80
    targetPort: 80

listener:
  image:
    repository: harry2654/prodhub
    tag: environmentorchestrator-listenerproduction-9472757-047fe06

config:
  serviceDomain: "prodhub.in"
  upstreamDnsAddr: "8.8.8.8:53"
  dnsConfigMapName: "environment-orchestrator-dns"
  dnsConfigMapMountPath: "/var/run/environment-orchestrator-dns"
  customDnsRecordsFile: "/var/run/environment-orchestrator-dns/custom-records.json"
  trafficConfigMapName: "environment-orchestrator-traffic"
  trafficConfigMapMountPath: "/var/run/environment-orchestrator-traffic"
  trafficAllowlistFile: "/var/run/environment-orchestrator-traffic/source-ranges.txt"
  resyncInterval: "30s"
  syncTimeout: "5s"

serviceAccount:
  create: true
  name: ""

resources: {}

ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  ipAllowList:
    enabled: false
    sourceRanges: []

nodeSelector: {}
tolerations: []
affinity: {}
