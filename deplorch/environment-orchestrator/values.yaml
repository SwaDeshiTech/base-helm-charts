namespace: ""
baseReleaseName: ""

replicaCount: 1
pullPolicy: IfNotPresent

coredns:
  image:
    repository: dockerhub.prodhub.in/environmentorchestrator-corednsproduction-6646354
    tag: 2a75003
  service:
    type: ClusterIP
    port: 53
    protocol: UDP

haproxy:
  image:
    repository: dockerhub.prodhub.in/environmentorchestrator-haproxyproduction-1337173
    tag: 2a75003
  service:
    type: ClusterIP
    port: 80
    targetPort: 80

listener:
  image:
    repository: dockerhub.prodhub.in/environmentorchestrator-listenerproduction-6515072
    tag: 2a75003

config:
  serviceDomain: "pod.local"
  resyncInterval: "30s"
  syncTimeout: "5s"

serviceAccount:
  create: true
  name: ""

resources: {}

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

nodeSelector: {}
tolerations: []
affinity: {}
