{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default .Release.Name .Values.baseReleaseName }}-{{ .Values.namespace }}
  namespace: {{ .Values.namespace }}
  labels:
    release: {{ default .Release.Name .Values.baseReleaseName }}-{{ .Values.namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ default .Release.Name .Values.baseReleaseName }}-{{ .Values.namespace }}
  namespace: {{ .Values.namespace }}
  labels:
    release: {{ default .Release.Name .Values.baseReleaseName }}-{{ .Values.namespace }}
spec:
  rules:
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ default .Release.Name .Values.baseReleaseName }}-{{ .Values.namespace }}
  namespace: {{ .Values.namespace }}
  labels:
    release: {{ default .Release.Name .Values.baseReleaseName }}-{{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ default .Release.Name .Values.baseReleaseName }}-{{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ default .Release.Name .Values.baseReleaseName }}-{{ .Values.namespace }}
    namespace: {{ .Values.namespace }}
