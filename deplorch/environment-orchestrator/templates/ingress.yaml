apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: environment-orchestrator-{{ default .Values.namespace .Values.ephemeralEnvironmentName }}
  namespace: {{ .Values.namespace }}
  labels:
    release: environment-orchestrator-{{ default .Values.namespace .Values.ephemeralEnvironmentName }}
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: "*.{{ default .Values.namespace .Values.ephemeralEnvironmentName }}.init.prodhub.in"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: environment-orchestrator-{{ default .Values.namespace .Values.ephemeralEnvironmentName }}-proxy
                port:
                  number: 80
