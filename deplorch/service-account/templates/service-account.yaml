apiVersion: v1
kind: ServiceAccount
metadata:
  name: prodhub-sa
  namespace: {{ .Values.namespace }}
  annotations:
    vault.hashicorp.com/role: prodhub-role
{{- if .Values.annotations }}
{{ toYaml .Values.annotations | indent 4 }}
{{- end }}
{{- if or (eq .Values.namespace "prodhub") (eq .Values.namespace "cicaptain") (eq .Values.namespace "cloudedgedeployer") (eq .Values.namespace "gateway") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prodhub-sa-vault-tokenreview-binding-{{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: prodhub-sa
    namespace: {{ .Values.namespace }}
{{- end }}
