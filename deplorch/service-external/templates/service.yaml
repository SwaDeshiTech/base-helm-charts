apiVersion: v1
kind: Service
metadata:
  labels:
    release: {{ default .Release.Name .Values.baseReleaseName }}
    type: k8s
  name: {{ default .Release.Name .Values.baseReleaseName }}-k8s
  namespace: {{.Values.namespace}}
spec:
  selector:
    release: {{ default .Release.Name .Values.baseReleaseName }}
  type: NodePort
  ports:
    {{- if eq .Values.isGRPCPortEnabled "enabled" }}
    - name: grpc
      port: 80
      targetPort: {{.Values.grpcPort}}
      nodePort: {{.Values.grpcPort}}
    - name: http
      port: 8080
      targetPort: {{.Values.ports}}
      nodePort: {{.Values.nodePort}}
    {{- else}}
    - name: http
      port: 80
      targetPort: {{.Values.ports}}
      nodePort: {{.Values.nodePort}}
    {{- end}}

