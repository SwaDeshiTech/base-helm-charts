{{- if .Values.ingressYaml }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Values.namespace }}
  {{- if .Values.ingressClassName }}
  ingressClassName: {{ .Values.ingressClassName }}
  {{- end }}
  {{- $annotations := .Values.ingressAnnotations }}
  {{- if and $annotations (kindIs "string" $annotations) }}
    {{- $annotations = fromJson $annotations }}
  {{- end }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
{{- $ingressRules := .Values.ingressYaml }}
{{- if and $ingressRules (kindIs "string" $ingressRules) }}
  {{- $ingressRules = $ingressRules | replace "\\n" "\n" }}
  {{- $ingressRules = fromYamlArray $ingressRules }}
{{- end }}
{{- if and $ingressRules (kindIs "slice" $ingressRules) }}
  {{- range $idx, $rule := $ingressRules }}
    {{- if and $rule.http $rule.http.paths (not (hasKey ($rule.http.paths | first) "backend")) }}
      {{- range $path := $rule.http.paths }}
        {{- $svcName := default (default $.Release.Name $.Values.baseReleaseName) $path.serviceName }}
        {{- $svcPort := default 80 $path.port }}
        {{- $_ := set $path "pathType" (default "Prefix" $path.pathType) }}
        {{- $_ := set $path "backend" (dict "service" (dict "name" $svcName "port" (dict "number" $svcPort))) }}
        {{- $_ := unset $path "serviceName" }}
        {{- $_ := unset $path "port" }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
spec:
  rules:
    {{- toYaml $ingressRules | nindent 4 }}
{{- end }}